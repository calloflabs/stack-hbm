<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--bg:#f7edc9;--fg:#2a2418;--acc:#ffb000;--green:#2ea043;--red:#e0342c;--panel:#fff7e0;--line:#8a7a55;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f3e7bf}}
:root[data-theme="dark"]{--bg:#f3e7bf}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#fffbe8 0%,#f9f0cc 45%,#efe3b6 100%)}
#wrap::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(120,100,50,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,100,50,.08) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
canvas{display:block;width:100%;height:100%;touch-action:none;position:relative;z-index:1}
#hud,#err,.overlay{z-index:2}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 3px #e9dcb8,0 4px 10px rgba(80,60,20,.18)}
.panel .tab{position:absolute;left:-3px;bottom:-30px;background:var(--line);color:#fff7e0;font-weight:800;font-size:13px;letter-spacing:1px;padding:5px 12px;border-radius:0 0 10px 10px}
#nextPanel{left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:96px;height:96px;display:flex;align-items:center;justify-content:center}
#nextCv{width:80px;height:80px}
#scorePanel{left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:170px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#scorePanel .tab{bottom:auto;top:-30px;border-radius:10px 10px 0 0}
#score{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px;font-style:italic}
#best{font-size:14px;opacity:.7;font-weight:700;margin-top:4px;font-style:italic}
.btns{position:absolute;right:14px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#btnsTop{top:calc(env(safe-area-inset-top,0px) + 14px)}
#btnsBot{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.ib{width:52px;height:52px;background:var(--panel);border:3px solid var(--line);border-radius:10px;color:#2a2418;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #e9dcb8,0 4px 10px rgba(80,60,20,.18);cursor:pointer;font-family:inherit;padding:0}
.ib:active{transform:scale(.94)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:11px;opacity:.6;color:#2a2418;font-weight:700;text-align:center;line-height:1.4;white-space:nowrap}
.overlay{position:absolute;inset:0;background:rgba(60,48,20,.78);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:auto;gap:12px;z-index:5}
.modal{background:var(--panel);border:4px solid var(--line);border-radius:16px;box-shadow:inset 0 0 0 4px #e9dcb8;padding:22px 20px;width:min(360px,92vw);color:#2a2418;max-height:86vh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:26px;font-style:italic;letter-spacing:-.5px;border-bottom:2px solid var(--line);padding-bottom:10px}
.modal p{margin:0;line-height:1.55;font-size:15px}
.modal .ghost{border-color:#2a2418;color:#2a2418}
.tutImg{width:100%;height:170px;background:#f7edc9;border-radius:10px;display:block;margin:10px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:26px;font-weight:900}
.nav .dots{display:flex;gap:8px}.nav .dots i{width:9px;height:9px;border-radius:50%;background:#c9b98a;display:block}.nav .dots i.on{background:#2a2418}
.nav button{background:none;border:0;color:#2a2418;font:inherit;font-size:28px;padding:4px 12px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e0d2a8;font-size:15px}
.row:last-child{border-bottom:0}
.tog{width:52px;height:30px;border-radius:15px;background:#b9a97e;position:relative;cursor:pointer;border:0;padding:0}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on::after{left:26px}
.rank{display:grid;grid-template-columns:32px 1fr auto;gap:8px 10px;text-align:left;font-size:15px;margin-top:6px}
.rank .me{color:#b36b00;font-weight:900}
.nameRow{display:flex;gap:8px;justify-content:center;align-items:center}
.nameRow input{font:inherit;font-size:16px;font-weight:800;padding:10px 12px;border-radius:12px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;width:150px;text-align:center;outline:none}
.nameRow input::placeholder{color:rgba(255,255,255,.55)}
#subMsg{font-size:14px;min-height:20px;color:var(--acc);font-weight:800}
.rank .hd{grid-column:1/4;font-size:12px;opacity:.6;border:0;padding:8px 0 2px}
.rank div{padding:6px 0;border-bottom:1px solid #e0d2a8}
.ghost.dark{border-color:#2a2418;color:#2a2418}
#dev{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}#dev.on{display:block}
#dev .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}#dev .grid button{font:inherit;font-size:12px;font-weight:800;padding:8px 4px;border-radius:8px;border:2px solid var(--line);background:#fff;color:#2a2418}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;display:flex;gap:6px}.lang button{pointer-events:auto;font:inherit;font-weight:900;font-size:13px;padding:6px 10px;border-radius:8px;border:2px solid #fff;background:none;color:#fff;cursor:pointer}.lang button.on{background:#fff;color:#2a2418}
.overlay h1{margin:0;font-size:38px;letter-spacing:-1.5px;line-height:1.1;font-style:italic}
.overlay h1 small{display:block;font-size:16px;color:var(--acc);letter-spacing:0;margin-top:6px;font-weight:800;font-style:normal}
.overlay p{margin:0;line-height:1.55;max-width:320px;font-size:15px;opacity:.9}
.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:340px;margin:4px 0}
.chain span{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.overlay button.main{pointer-events:auto;font:inherit;font-size:20px;font-weight:900;padding:14px 32px;border:0;border-radius:14px;background:var(--acc);color:#1a1a1a;box-shadow:0 6px 0 #b8901a;cursor:pointer}
.overlay button.main:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901a}
.ghost{background:none;border:2px solid #fff;color:#fff;font:inherit;font-weight:800;padding:10px 18px;border-radius:12px;cursor:pointer}
.big{font-size:64px;font-weight:900;color:var(--acc);line-height:1;font-style:italic}
.sub{font-size:15px;opacity:.85}
#err{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);background:#b00020;color:#fff;font-size:12px;padding:8px;border-radius:8px;display:none;z-index:9;white-space:pre-wrap;pointer-events:auto}
[hidden]{display:none!important}
</style>
</head>

    const kick=t0=>{const o=c.createOscillator(),g=c.createGain();const T=c.currentTime+t0;o.frequency.setValueAtTime(140,T);o.frequency.exponentialRampToValueAtTime(45,T+0.12);g.gain.setValueAtTime(0.16,T);g.gain.exponentialRampToValueAtTime(0.0001,T+0.2);o.connect(g).connect(mg);o.start(T);o.stop(T+0.25);};

  setMusic(on){if(this.musicGain)this.musicGain.gain.setTargetAtTime(on?1:0,this.ctx.currentTime,0.1);},
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);

  resume(){if(this.ctx&&this.ctx.state!=='running'){try{this.ctx.resume();}catch(e){}}},
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:1;},
  apply(){this.setMute(!SET.sound);},
  tone(f,dur,type,vol,t0,slide){const c=this.ctx;if(!c)return;t0=t0||0;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';const T=c.currentTime+t0;o.frequency.setValueAtTime(f,T);if(slide)o.frequency.exponentialRampToValueAtTime(slide,T+dur);g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(vol||0.2,T+0.012);g.gain.exponentialRampToValueAtTime(0.0001,T+dur);o.connect(g).connect(this.master);o.start(T);o.stop(T+dur+0.05);},
  noise(dur,vol,freq,t0){const c=this.ctx;if(!c)return;t0=t0||0;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;const g=c.createGain();const T=c.currentTime+t0;g.gain.setValueAtTime(vol||0.15,T);g.gain.exponentialRampToValueAtTime(0.0001,T+dur);s.connect(f).connect(g).connect(this.master);s.start(T);},
  drop(){this.tone(420,0.08,'triangle',0.12,0,260);},
  merge(t){const f=330*Math.pow(1.12,t);this.tone(f,0.12,'square',0.1);this.tone(f*1.5,0.18,'square',0.1,0.08);},
  hbm(){[523,659,784,1046,1318].forEach((f,i)=>this.tone(f,0.16,'square',0.14,i*0.09));this.tone(1568,0.8,'sine',0.16,0.45);},
  ship(){this.noise(0.5,0.3,800);[784,1046,1318,1568,2093].forEach((f,i)=>this.tone(f,0.2,'triangle',0.16,0.1+i*0.08));},
  warn(){this.tone(880,0.07,'square',0.08);},
  crack(){this.noise(0.6,0.5,1500);this.tone(120,0.6,'sawtooth',0.2,0,40);},

function setup(){engine=Engine.create({gravity:{x:0,y:0}});engine.positionIterations=8;engine.velocityIterations=6;
  const wall=[];for(let i=0;i<WALL_SEG;i++){const a=i/WALL_SEG*Math.PI*2,a2=(i+1)/WALL_SEG*Math.PI*2;const len=2*Math.PI*(R+6)/WALL_SEG+2;const mx=Math.cos((a+a2)/2)*(R+6),my=Math.sin((a+a2)/2)*(R+6);wall.push(Bodies.rectangle(mx,my,len,12,{isStatic:true,angle:(a+a2)/2+Math.PI/2,friction:0.05,restitution:0.2,label:'wall'}));}
  Composite.add(engine.world,wall);

  Events.on(engine,'beforeUpdate',applyForces);}
function makePiece(tier,x,y){const t=TIERS[tier];const b=Bodies.circle(x,y,t.r,{restitution:0.15,friction:0.08,frictionAir:0.02,density:0.0012,label:'piece'});b.tier=tier;b.danger=0;b.born=performance.now();Composite.add(engine.world,b);pieces.push(b);return b;}

function merge(a,b){const tier=a.tier;const mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;const vx=(a.velocity.x+b.velocity.x)/2,vy=(a.velocity.y+b.velocity.y)/2;
  removePiece(a);removePiece(b);
  if(TIERS[tier].hbm){score+=1000;hbmCount++;popups.push({x:mx,y:my,t:0,txt:T().ship,big:true});AU.ship();flash=1;return;}
  const nb=makePiece(tier+1,mx,my);Body.setVelocity(nb,{x:vx*0.5,y:vy*0.5});const pts=TIERS[tier+1].pts;score+=pts;popups.push({x:mx,y:my,t:0,txt:'+'+pts,big:false});
  if(TIERS[tier+1].hbm){AU.hbm();flash=0.6;popups.push({x:mx,y:my-40,t:0,txt:T().hbm,big:true});}else AU.merge(tier);}
function applyForces(){for(const b of pieces){const px=b.position.x,py=b.position.y;const r=Math.hypot(px,py)||0.001;const ux=px/r,uy=py/r;const m=b.mass;
  let fx=-ux*m*G_IN,fy=-uy*m*G_IN;                                  // toward the chuck
  const cf=m*SPIN_OUT*spin*spin*(r/R);fx+=ux*cf;fy+=uy*cf;           // centrifugal
  const tx=-uy*spinDir,ty=ux*spinDir;const vt=b.velocity.x*tx+b.velocity.y*ty;const target=spin*OMEGA*r;const dv=target-vt;fx+=tx*m*K_T*dv;fy+=ty*m*K_T*dv;  // floor drag → co-rotation
  Body.applyForce(b,b.position,{x:fx,y:fy});}}

function renderTut(){const TUT=T().tut,C=T().tutCap;$('tutTxt').textContent=TUT[tutStep];[...document.querySelectorAll('#tut .dots i')].forEach((d,i)=>d.classList.toggle('on',i===tutStep));const c=$('tutCv'),g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,640,340);g.translate(320,175);const RR=130;
  g.beginPath();g.arc(0,0,RR+8,0,Math.PI*2);g.fillStyle='#8f96a3';g.fill();g.beginPath();g.arc(0,0,RR,0,Math.PI*2);g.fillStyle='#c4cad4';g.fill();g.beginPath();g.arc(0,0,14,0,Math.PI*2);g.fillStyle='#0f1526';g.fill();

/* ---------- draw ---------- */
function drawPieceOn(g,b,x,y,rot,r,look,dead){const t=TIERS[b.tier];g.save();g.translate(x,y);g.rotate(rot);
  if(t.hbm){const cols=['#ff4d4d','#ffb84d','#ffff4d','#4dff88','#4dd2ff','#b84dff'];for(let i=0;i<6;i++){g.beginPath();g.arc(0,0,r+2,i/6*Math.PI*2,(i+1)/6*Math.PI*2+0.05);g.strokeStyle=cols[i];g.lineWidth=5;g.stroke();}}
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);if(t.hbm){const gg=g.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);gg.addColorStop(0,'#fff1b0');gg.addColorStop(0.55,'#f5b731');gg.addColorStop(1,'#c47a00');g.fillStyle=gg;}else g.fillStyle=t.c;g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;g.stroke();
  g.beginPath();g.arc(-r*0.3,-r*0.35,r*0.28,0,Math.PI*2);g.fillStyle='rgba(255,255,255,.18)';g.fill();
  if(t.layers){g.strokeStyle=t.hbm?'rgba(120,60,0,.35)':'rgba(255,255,255,.55)';g.lineWidth=t.layers>=12?1.4:2;const n=t.layers;for(let i=0;i<n;i++){const yy=-r*0.5+(i+0.5)/n*r;const hw=Math.sqrt(Math.max(0,r*r*0.8-yy*yy));g.beginPath();g.moveTo(-hw,yy);g.lineTo(hw,yy);g.stroke();}}
  if(b.tier===3){g.fillStyle='rgba(0,0,0,.3)';for(let i=0;i<3;i++)for(let j=0;j<3;j++)g.fillRect(-r*0.55+i*r*0.4,-r*0.55+j*r*0.4,r*0.22,r*0.22);}
  if(b.tier===5){g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<6;i++){const a=i/6*Math.PI*2;g.beginPath();g.arc(Math.cos(a)*r*0.55,Math.sin(a)*r*0.55,r*0.09,0,Math.PI*2);g.fill();}}
  if(b.tier===7){g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(i*r*0.35,-r*0.65);g.lineTo(i*r*0.35,r*0.65);g.stroke();}}
  g.rotate(-rot);
  // googly eyes
  const er=r*0.22,ex=r*0.3,ey=-r*0.12;const lx=(look?look.x:0)*er*0.45,ly=(look?look.y:0)*er*0.45;
  const shades=t.hbm||b.tier===3;
  if(!shades)for(const sx of [-1,1]){g.beginPath();g.arc(sx*ex,ey,er,0,Math.PI*2);g.fillStyle='#fff';g.fill();g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;g.stroke();
    if(dead){g.strokeStyle='#222';g.lineWidth=Math.max(2,er*0.3);g.beginPath();g.moveTo(sx*ex-er*0.5,ey-er*0.5);g.lineTo(sx*ex+er*0.5,ey+er*0.5);g.moveTo(sx*ex+er*0.5,ey-er*0.5);g.lineTo(sx*ex-er*0.5,ey+er*0.5);g.stroke();}
    else{g.beginPath();g.arc(sx*ex+lx,ey+ly,er*0.5,0,Math.PI*2);g.fillStyle='#1a1a1a';g.fill();g.beginPath();g.arc(sx*ex+lx-er*0.15,ey+ly-er*0.18,er*0.16,0,Math.PI*2);g.fillStyle='#fff';g.fill();}}
  if(shades){const lw=er*1.25,lh=er*0.95;g.lineWidth=Math.max(1.5,er*0.14);g.strokeStyle='#1a1a1a';g.beginPath();g.moveTo(-ex-lw,ey-lh*0.2);g.lineTo(-r*0.98,ey-lh*0.35);g.moveTo(ex+lw,ey-lh*0.2);g.lineTo(r*0.98,ey-lh*0.35);g.moveTo(-ex+lw*0.9,ey-lh*0.25);g.lineTo(ex-lw*0.9,ey-lh*0.25);g.stroke();
    for(const sx of [-1,1]){g.beginPath();g.moveTo(sx*ex-lw,ey-lh*0.55);g.lineTo(sx*ex+lw,ey-lh*0.55);g.quadraticCurveTo(sx*ex+lw,ey+lh*0.9,sx*ex,ey+lh*0.9);g.quadraticCurveTo(sx*ex-lw,ey+lh*0.9,sx*ex-lw,ey-lh*0.55);g.closePath();const lg=g.createLinearGradient(sx*ex-lw,ey-lh,sx*ex+lw,ey+lh);lg.addColorStop(0,'#3a3a44');lg.addColorStop(0.5,'#101014');lg.addColorStop(1,'#2a2a34');g.fillStyle=lg;g.fill();g.stroke();g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=Math.max(1,er*0.12);g.beginPath();g.moveTo(sx*ex-lw*0.6,ey-lh*0.2);g.lineTo(sx*ex-lw*0.1,ey-lh*0.45);g.stroke();g.strokeStyle='#1a1a1a';g.lineWidth=Math.max(1.5,er*0.14);}}   // sunglasses: 노광(UV) · 12단
  if(b.tier===4||b.tier===5){g.strokeStyle='#e8f4ff';g.lineWidth=Math.max(2,er*0.28);for(const sx of [-1,1]){g.beginPath();g.arc(sx*ex,ey,er+er*0.2,0,Math.PI*2);g.stroke();}g.beginPath();g.moveTo(-ex+er*1.1,ey);g.lineTo(ex-er*1.1,ey);g.stroke();g.strokeStyle='#3a7bd5';g.lineWidth=Math.max(1.5,er*0.18);g.beginPath();g.moveTo(-ex-er*1.2,ey);g.lineTo(-r,ey-er*0.3);g.moveTo(ex+er*1.2,ey);g.lineTo(r,ey-er*0.3);g.stroke();}   // goggles: 식각 · 증착
  if(b.tier===5){const mw=ex*1.05,mh=er*0.8,my=r*0.3,rr=mh*0.35;g.strokeStyle='#e8f4ff';g.lineWidth=Math.max(1.5,er*0.16);g.beginPath();g.moveTo(-mw,my-mh*0.3);g.lineTo(-r*0.98,my-mh*0.9);g.moveTo(mw,my-mh*0.3);g.lineTo(r*0.98,my-mh*0.9);g.stroke();
    g.fillStyle='#f7f7f7';g.beginPath();g.moveTo(-mw+rr,my-mh);g.lineTo(mw-rr,my-mh);g.quadraticCurveTo(mw,my-mh,mw,my-mh+rr);g.lineTo(mw,my+mh-rr);g.quadraticCurveTo(mw,my+mh,mw-rr,my+mh);g.lineTo(-mw+rr,my+mh);g.quadraticCurveTo(-mw,my+mh,-mw,my+mh-rr);g.lineTo(-mw,my-mh+rr);g.quadraticCurveTo(-mw,my-mh,-mw+rr,my-mh);g.closePath();g.fill();g.strokeStyle='#c9c9c9';g.lineWidth=1;g.stroke();
    g.strokeStyle='rgba(0,0,0,.12)';g.beginPath();for(let i=-1;i<=1;i++){g.moveTo(-mw*0.8,my+i*mh*0.45);g.lineTo(mw*0.8,my+i*mh*0.45);}g.stroke();}   // mask: 증착
  if(b.tier===9){g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.moveTo(-ex-er*0.8,ey-er*1.15);g.lineTo(-ex+er*0.8,ey-er*0.8);g.moveTo(ex+er*0.8,ey-er*1.15);g.lineTo(ex-er*0.8,ey-er*0.8);g.stroke();}   // stressed brows
  g.fillStyle='#fff';g.font='bold '+Math.max(8,r*0.36)+'px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=3;g.fillText(T().tiers[b.tier],0,b.tier===5?r*0.68:r*0.45);
  g.restore();}
function drawPiece(b,x,y,rot,dt){const v=b.velocity||{x:0,y:0};const sp=Math.hypot(v.x,v.y);const tx=sp>0.6?Math.max(-1,Math.min(1,v.x/3)):0,ty=sp>0.6?Math.max(-1,Math.min(1,v.y/3)):0.3;if(b.lookX===undefined){b.lookX=tx;b.lookY=ty;}const k=Math.min(1,(dt||0.016)*5);b.lookX+=(tx-b.lookX)*k;b.lookY+=(ty-b.lookY)*k;drawPieceOn(ctx,b,x,y,rot,TIERS[b.tier].r,{x:b.lookX,y:b.lookY},b.danger>1.2);}

let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(!(dt>0)||dt>0.1)dt=0.016;
  const r=cv.getBoundingClientRect();if(Math.round(r.width)!==Math.round(W)||Math.round(r.height)!==Math.round(H)||cv.width===0)resize();
  // spin control
  if(hold.down){hold.t+=dt;if(hold.t>=0.22){spinDir=(hold.x<W/2?-1:1)*(SET.left?-1:1);spin+=(1-spin)*Math.min(1,dt*3.5);}}else spin+=(0-spin)*Math.min(1,dt*2.2);
  if(!playing||paused)spin=0;angle+=spin*OMEGA*60*dt*spinDir;AU.spin(spin,spinDir);
  if(playing&&!paused){timeAlive+=dt;dropCd-=dt;armA+=dt*0.7;acc+=dt;let steps=0;while(acc>1/60&&steps<4){Engine.update(engine,1000/60);acc-=1/60;steps++;}mergedIds.clear();
    // danger: pressed against the wall
    let worst=0;for(const b of pieces){const d=Math.hypot(b.position.x,b.position.y)+TIERS[b.tier].r;const touching=d>R-2&&performance.now()-b.born>600;b.danger=touching?b.danger+dt:Math.max(0,b.danger-dt*2);worst=Math.max(worst,b.danger);if(b.danger>=DANGER_T){gameOver();break;}}
    if(worst>0.5&&Math.floor(now/250)%2===0&&Math.floor(now/250)!==Math.floor((now-dt*1000)/250))AU.warn();
    if(pieces.length>140)gameOver();}
  flash=Math.max(0,flash-dt*1.5);
  // ---- draw ----
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  const worstDanger=pieces.reduce((m,b)=>Math.max(m,b.danger),0);
  ctx.save();ctx.translate(cx,cy);ctx.scale(K,K);
  // chamber
  ctx.beginPath();ctx.arc(0,0,R+16,0,Math.PI*2);ctx.fillStyle='#a3aab5';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,R+4,0,Math.PI*2);ctx.fillStyle='#c3c9d2';ctx.fill();
  ctx.save();ctx.rotate(angle);const grd=ctx.createRadialGradient(0,0,10,0,0,R);grd.addColorStop(0,'#f4f6f9');grd.addColorStop(1,'#cfd5dd');ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.04)';ctx.lineWidth=2;for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(i/12*Math.PI*2)*R,Math.sin(i/12*Math.PI*2)*R);ctx.stroke();}
  for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(0,0,R*k/3.3,0,Math.PI*2);ctx.stroke();}ctx.restore();
  // chuck
  ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fillStyle='#7d8590';ctx.fill();ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fillStyle=playing&&spin<0.05?'#39d353':'#ffd23f';ctx.fill();
  // danger rim
  const dangerAlpha=Math.min(1,worstDanger/DANGER_T);ctx.beginPath();ctx.arc(0,0,R+4,0,Math.PI*2);ctx.strokeStyle='rgba(255,59,59,'+(dangerAlpha*(0.5+0.5*Math.sin(now/60)))+')';ctx.lineWidth=8;ctx.stroke();
  // spin indicator
  if(spin>0.05){ctx.strokeStyle='rgba(255,210,63,'+(spin*0.8)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,R+22,angle,angle+1.2*spinDir,spinDir<0);ctx.stroke();}
  // pieces
  for(const b of pieces){drawPiece(b,b.position.x,b.position.y,b.angle,dt);if(b.danger>0.3){ctx.beginPath();ctx.arc(b.position.x,b.position.y,TIERS[b.tier].r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,b.danger/DANGER_T));ctx.strokeStyle='#ff3b3b';ctx.lineWidth=4;ctx.stroke();}}
  // arm + next piece
  if(playing){const ax=Math.cos(armA)*(R+26),ay=Math.sin(armA)*(R+26);ctx.save();ctx.translate(ax,ay);ctx.rotate(armA);ctx.fillStyle='#5b6470';ctx.fillRect(-6,-14,20,28);ctx.fillStyle='#3d434c';ctx.fillRect(10,-4,18,8);ctx.restore();
    const t=TIERS[curTier];const px=Math.cos(armA)*(R+26-t.r-8),py=Math.sin(armA)*(R+26-t.r-8);ctx.globalAlpha=0.9;drawPieceOn(ctx,{tier:curTier},px,py,0,t.r,{x:-Math.cos(armA),y:-Math.sin(armA)});ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(0,0);ctx.stroke();ctx.setLineDash([]);}
  // popups
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.t+=dt;if(p.t>1.1){popups.splice(i,1);continue;}ctx.globalAlpha=1-Math.max(0,p.t-0.6)/0.5;ctx.fillStyle=p.big?'#c47a00':'#2a2418';ctx.font='bold '+(p.big?30:18)+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=4;ctx.fillText(p.txt,p.x,p.y-p.t*40);ctx.shadowBlur=0;ctx.globalAlpha=1;}
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,240,180,'+flash*0.6+')';ctx.fillRect(0,0,W,H);}
  $('score').textContent=score.toLocaleString();if(score>best){best=score;$('best').textContent='BEST: '+best.toLocaleString();}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){AU.resume();setTimeout(()=>AU.resume(),300);}});
window.addEventListener('focus',()=>AU.resume());window.addEventListener('pageshow',()=>AU.resume());
['touchend','mouseup','click'].forEach(ev=>document.addEventListener(ev,()=>AU.resume(),{passive:true}));
